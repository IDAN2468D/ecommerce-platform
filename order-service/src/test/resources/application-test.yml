server:
  port: 0

spring:
  application:
    name: order-service-test
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/orders_test_db?uuidRepresentation=standard
      auto-index-creation: true

clients:
  inventory:
    base-url: http://localhost:9999
  payment:
    base-url: http://localhost:9999

management:
  tracing:
    enabled: false

logging:
  level:
    com.company.orderservice: DEBUG
