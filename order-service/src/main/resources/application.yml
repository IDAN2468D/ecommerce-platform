server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      # /mongodb-connection Best Practices for OLTP Microservice:
      # maxPoolSize=50, minPoolSize=10, maxIdleTimeMS=300000 (5m), connectTimeoutMS=5000 (5s),
      # socketTimeoutMS=30000 (30s), serverSelectionTimeoutMS=5000 (5s), waitQueueTimeoutMS=5000 (5s)
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.common.events,com.company.*,*"

clients:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 2500ms
      paymentService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 2500ms
  retry:
    instances:
      inventoryService:
        maxAttempts: 3
        waitDuration: 500ms
      paymentService:
        maxAttempts: 2
        waitDuration: 500ms
  bulkhead:
    instances:
      inventoryService:
        maxConcurrentCalls: 50
        maxWaitDuration: 250ms
      paymentService:
        maxConcurrentCalls: 40
        maxWaitDuration: 250ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  pattern:
    level: "%5p [${spring.application.name:order-service},%X{traceId:-},%X{spanId:-}]"
