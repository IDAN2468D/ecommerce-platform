global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8081']

  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8082']

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8083']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8085']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8084']

  - job_name: 'shipping-delivery-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['shipping-delivery-service:8086']

  - job_name: 'review-rating-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['review-rating-service:8087']

  - job_name: 'cart-wishlist-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cart-wishlist-service:8088']

  - job_name: 'recommendation-loyalty-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['recommendation-loyalty-service:8089']

  - job_name: 'workspace-integration-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['workspace-integration-service:8091']
