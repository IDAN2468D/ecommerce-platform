services:
  - type: web
    name: ecommerce-web-client
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web-client
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        value: http://localhost:8080
