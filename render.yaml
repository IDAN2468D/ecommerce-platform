envVarGroups:
- name: platform-shared-secrets
  envVars:
  - key: MONGODB_URI
    sync: false
  - key: KAFKA_BOOTSTRAP_SERVERS
    value: platform-kafka:9092
  - key: JWT_SECRET
    generateValue: true
  - key: GEMINI_API_KEY
    sync: false
  - key: SPRING_PROFILES_ACTIVE
    value: prod
  - key: SPRING_THREADS_VIRTUAL_ENABLED
    value: 'true'
services:
- type: keyvalue
  name: platform-redis
  region: frankfurt
  plan: starter
  ipAllowList: []
- type: pserv
  name: platform-kafka
  runtime: image
  image:
    url: docker.io/confluentinc/cp-kafka:7.6.0
  region: frankfurt
  plan: starter
  envVars:
  - key: KAFKA_NODE_ID
    value: '1'
  - key: KAFKA_PROCESS_ROLES
    value: 'broker,controller'
  - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
    value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
  - key: KAFKA_LISTENERS
    value: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
  - key: KAFKA_ADVERTISED_LISTENERS
    value: 'PLAINTEXT://platform-kafka:9092'
  - key: KAFKA_INTER_BROKER_LISTENER_NAME
    value: 'PLAINTEXT'
  - key: KAFKA_CONTROLLER_LISTENER_NAMES
    value: 'CONTROLLER'
  - key: KAFKA_CONTROLLER_QUORUM_VOTERS
    value: '1@platform-kafka:29093'
  - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
    value: '1'
  - key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
    value: '0'
  - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
    value: '1'
  - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    value: '1'
  - key: KAFKA_LOG_DIRS
    value: '/tmp/kraft-combined-logs'
  - key: CLUSTER_ID
    value: 'MkU3OEVBNTcwNTJENDM2Qk'
  - key: KAFKA_JVM_PERFORMANCE_OPTS
    value: '-Xms128m -Xmx384m'

- type: web
  name: platform-kafka-ui
  runtime: image
  image:
    url: docker.io/provectuslabs/kafka-ui:latest
  region: frankfurt
  plan: starter
  envVars:
  - key: KAFKA_CLUSTERS_0_NAME
    value: render-cluster
  - key: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
    value: platform-kafka:9092
  - key: JAVA_OPTS
    value: '-Xms64m -Xmx256m -XX:+UseG1GC'

- type: web
  name: web-client
  runtime: docker
  region: frankfurt
  plan: starter
  dockerContext: ./web-client
  dockerfilePath: ./web-client/Dockerfile
  envVars:
  - key: NEXT_PUBLIC_API_GATEWAY_URL
    fromService:
      type: web
      name: api-gateway
      property: host
  - key: GATEWAY_URL
    fromService:
      type: web
      name: api-gateway
      property: host
- type: web
  name: api-gateway
  runtime: docker
  region: frankfurt
  plan: starter
  dockerContext: .
  dockerfilePath: api-gateway/Dockerfile.render
  healthCheckPath: /actuator/health
  envVars:
  - fromGroup: platform-shared-secrets
  - key: REDIS_HOST
    fromService:
      type: keyvalue
      name: platform-redis
      property: host
  - key: REDIS_PORT
    fromService:
      type: keyvalue
      name: platform-redis
      property: port
  - key: ORDER_SERVICE_URL
    value: http://order-service:8081
  - key: INVENTORY_SERVICE_URL
    value: http://inventory-service:8082
  - key: PAYMENT_SERVICE_URL
    value: http://payment-service:8083
  - key: AUTH_SERVICE_URL
    value: http://auth-service:8084
  - key: NOTIFICATION_SERVICE_URL
    value: http://notification-service:8085
  - key: SHIPPING_SERVICE_URL
    value: http://shipping-delivery-service:8086
  - key: REVIEW_SERVICE_URL
    value: http://review-rating-service:8087
  - key: CART_SERVICE_URL
    value: http://cart-wishlist-service:8088
  - key: LOYALTY_SERVICE_URL
    value: http://recommendation-loyalty-service:8089
  - key: WORKSPACE_SERVICE_URL
    value: http://workspace-integration-service:8091
  - key: RAG_SERVICE_URL
    value: http://rag-service:8092
  - key: AGENT_SWARM_SERVICE_URL
    value: http://agent-swarm-service:8093
  - key: RMA_SERVICE_URL
    value: http://rma-returns-service:8094
  - key: PRICING_SERVICE_URL
    value: http://dynamic-pricing-service:8095
  - key: FRAUD_SERVICE_URL
    value: http://fraud-risk-service:8096
  - key: ANALYTICS_SERVICE_URL
    value: http://merchant-analytics-service:8097
  - key: SUBSCRIPTION_SERVICE_URL
    value: http://subscription-billing-service:8098
  - key: MARKETPLACE_SERVICE_URL
    value: http://marketplace-vendor-service:8099
