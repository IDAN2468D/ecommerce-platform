services:
  - type: web
    name: ecommerce-web-client
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web-client
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        value: http://localhost:8080
