      dockerfile: Dockerfile
    container_name: review-rating-service
    ports:
      - "8087:8087"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      MONGODB_URI: ${REVIEW_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  cart-wishlist-service:
    build:
      context: ./cart-wishlist-service
      dockerfile: Dockerfile
    container_name: cart-wishlist-service
    ports:
      - "8088:8088"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      MONGODB_URI: ${CART_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  recommendation-loyalty-service:
    build:
      context: ./recommendation-loyalty-service
      dockerfile: Dockerfile
    container_name: recommendation-loyalty-service
    ports:
      - "8089:8089"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${LOYALTY_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_SERVICE_URL: http://rag-service:8092
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "8092:8092"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${RAG_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CART_SERVICE_URL: http://cart-wishlist-service:8088
      ORDER_SERVICE_URL: http://order-service:8081
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  google-workspace-mcp:
    build:
      context: ./google-workspace-mcp
      dockerfile: Dockerfile
    container_name: google-workspace-mcp
    ports:
      - "8000:8000"
    environment:
      WORKSPACE_MCP_HOST: "0.0.0.0"
      FASTMCP_HOST: "0.0.0.0"
      WORKSPACE_MCP_PORT: "8000"
      FASTMCP_PORT: "8000"
      GOOGLE_CLIENT_SECRET_PATH: /app/credentials/client_secret.json
      GOOGLE_CLIENT_SECRETS: /app/credentials/client_secret.json
      WORKSPACE_MCP_CREDENTIALS_DIR: /app/credentials/tokens
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/credentials.json
      WORKSPACE_USER_EMAIL: ${WORKSPACE_USER_EMAIL:-idankzm@gmail.com}
    mem_limit: 256m
    volumes:
      - ./credentials:/app/credentials
    networks:
      - platform-network

  workspace-integration-service:
    build:
      context: ./workspace-integration-service
      dockerfile: Dockerfile
    container_name: workspace-integration-service
    ports:
      - "8091:8091"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      MONGODB_URI: ${WORKSPACE_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WORKSPACE_MCP_URL: http://google-workspace-mcp:8000
      WORKSPACE_USER_EMAIL: ${WORKSPACE_USER_EMAIL:-idankzm@gmail.com}
      DRIVE_INVOICES_FOLDER_ID: ${DRIVE_INVOICES_FOLDER_ID:-18Dinq5x46OWcqmTEljaXytGHd4jJ-aRw}
      CALENDAR_ID: ${CALENDAR_ID:-primary}
      INVOICE_SOURCE_URL_TEMPLATE: http://order-service:8081/api/v1/orders/%s/invoice
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      google-workspace-mcp:
        condition: service_started
    networks:
      - platform-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xms64m -Xmx384m"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AUTH_SERVICE_URL: http://auth-service:8084
      SHIPPING_SERVICE_URL: http://shipping-delivery-service:8086
      REVIEW_SERVICE_URL: http://review-rating-service:8087
      CART_SERVICE_URL: http://cart-wishlist-service:8088
      LOYALTY_SERVICE_URL: http://recommendation-loyalty-service:8089
      WORKSPACE_SERVICE_URL: http://workspace-integration-service:8091
      RAG_SERVICE_URL: http://rag-service:8092
      AGENT_SWARM_SERVICE_URL: http://agent-swarm-service:8093
      RMA_SERVICE_URL: http://rma-returns-service:8094
      PRICING_SERVICE_URL: http://dynamic-pricing-service:8095
      FRAUD_SERVICE_URL: http://fraud-risk-service:8096
      ANALYTICS_SERVICE_URL: http://merchant-analytics-service:8097
    mem_limit: 512m
    depends_on:
      - order-service
      - inventory-service
      - payment-service
      - notification-service
      - auth-service
      - shipping-delivery-service
      - review-rating-service
      - cart-wishlist-service
      - recommendation-loyalty-service
      - workspace-integration-service
      - rag-service
      - agent-swarm-service
      - rma-returns-service
      - dynamic-pricing-service
      - fraud-risk-service
      - merchant-analytics-service
    networks:
      - platform-network

  agent-swarm-service:
    build:
      context: ./agent-swarm-service
      dockerfile: Dockerfile
    container_name: agent-swarm-service
    ports:
      - "8093:8093"
    environment:
      AGENT_SWARM_PORT: "8093"
      GATEWAY_URL: http://api-gateway:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      SHIPPING_SERVICE_URL: http://shipping-delivery-service:8086
      REVIEW_SERVICE_URL: http://review-rating-service:8087
      CART_SERVICE_URL: http://cart-wishlist-service:8088
      LOYALTY_SERVICE_URL: http://recommendation-loyalty-service:8089
      WORKSPACE_SERVICE_URL: http://workspace-integration-service:8091
      RAG_SERVICE_URL: http://rag-service:8092
      RMA_SERVICE_URL: http://rma-returns-service:8094
      PRICING_SERVICE_URL: http://dynamic-pricing-service:8095
      FRAUD_SERVICE_URL: http://fraud-risk-service:8096
      ANALYTICS_SERVICE_URL: http://merchant-analytics-service:8097
      WORKSPACE_MCP_URL: http://google-workspace-mcp:8000
      JWT_SECRET: ${JWT_SECRET:-order-service-default-secret-key-32-bytes!!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo_key}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    mem_limit: 256m
    depends_on:
      - rag-service
      - order-service
      - cart-wishlist-service
      - workspace-integration-service
    networks:
      - platform-network

  rma-returns-service:
    build:
      context: ./rma-returns-service
      dockerfile: Dockerfile
    container_name: rma-returns-service
    ports:
      - "8094:8094"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  dynamic-pricing-service:
    build:
      context: ./dynamic-pricing-service
      dockerfile: Dockerfile
    container_name: dynamic-pricing-service
    ports:
      - "8095:8095"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  fraud-risk-service:
    build:
      context: ./fraud-risk-service
      dockerfile: Dockerfile
    container_name: fraud-risk-service
    ports:
      - "8096:8096"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  merchant-analytics-service:
    build:
      context: ./merchant-analytics-service
      dockerfile: Dockerfile
    container_name: merchant-analytics-service
    ports:
      - "8097:8097"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: web-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://api-gateway:8080
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      AGENT_SWARM_SERVICE_URL: http://agent-swarm-service:8093
      PORT: 3000
      HOSTNAME: 0.0.0.0
    mem_limit: 384m
    depends_on:
      - api-gateway
    networks:
      - platform-network

  prometheus:
    image: prom/prometheus:latest
    container_name: platform-prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - platform-network

  grafana:
    image: grafana/grafana:latest
    container_name: platform-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    mem_limit: 256m
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge

volumes:
  mongodb_platform_data:
