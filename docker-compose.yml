services:
  mongodb:
    image: mongo:7.0
    container_name: platform-mongodb
    ports:
      - "27017:27017"
    command: mongod --wiredTigerCacheSizeGB 0.25
    mem_limit: 512m
    volumes:
      - mongodb_platform_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - platform-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: platform-zipkin
    ports:
      - "9411:9411"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:+UseG1GC"
    mem_limit: 384m
    networks:
      - platform-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: platform-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    mem_limit: 768m
    networks:
      - platform-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platform-kafka-ui
    ports:
      - "8090:8080"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:+UseG1GC"
      KAFKA_CLUSTERS_0_NAME: platform-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    mem_limit: 384m
    depends_on:
      - kafka
    networks:
      - platform-network

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${INVENTORY_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - platform-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${PAYMENT_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_started
    networks:
      - platform-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_started
    networks:
      - platform-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xms64m -Xmx384m -Dspring.threads.virtual.enabled=true"
      MONGODB_URI: ${ORDER_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - platform-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      MONGODB_URI: ${AUTH_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_started
    networks:
      - platform-network

  shipping-delivery-service:
    build:
      context: ./shipping-delivery-service
      dockerfile: Dockerfile
    container_name: shipping-delivery-service
    ports:
      - "8086:8086"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
      MONGODB_URI: ${SHIPPING_MONGODB_URI:-mongodb://mongodb:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
