server:
  port: 8091

spring:
  application:
    name: workspace-integration-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/workspace_db}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: workspace-integration-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.common.events,com.company.*,*"

workspace:
  mcp:
    base-url: ${WORKSPACE_MCP_URL:http://localhost:8000}
    endpoint: ${WORKSPACE_MCP_ENDPOINT:/mcp}
    request-timeout: 20s
    auth-token: ${MCP_AUTH_TOKEN:}
    user-email: ${WORKSPACE_USER_EMAIL:operations@yourcompany.com}
    tools:
      drive-create-file: ${MCP_TOOL_DRIVE_CREATE:create_drive_file}
      calendar-create-event: ${MCP_TOOL_CALENDAR_CREATE:create_event}
      calendar-delete-event: ${MCP_TOOL_CALENDAR_DELETE:delete_event}
    drive:
      invoices-folder-id: ${DRIVE_INVOICES_FOLDER_ID:invoices_folder_default}
      invoice-source-url-template: ${INVOICE_SOURCE_URL_TEMPLATE:http://order-service:8081/api/v1/orders/%s/invoice}
    calendar:
      calendar-id: ${CALENDAR_ID:primary}
      time-zone: Asia/Jerusalem
      delivery-window: 2h

resilience4j:
  retry:
    instances:
      workspaceMcp:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        ignore-exceptions:
          - com.company.workspace.mcp.McpToolException
  circuitbreaker:
    instances:
      workspaceMcp:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - com.company.workspace.mcp.McpToolException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
