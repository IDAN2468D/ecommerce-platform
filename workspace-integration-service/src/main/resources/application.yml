server:
  port: 8091

spring:
  application:
    name: workspace-integration-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/workspace_db}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: workspace-integration-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.common.events,com.company.*,*"

workspace:
  mcp:
    base-url: ${WORKSPACE_MCP_URL:http://localhost:8000}
    endpoint: ${WORKSPACE_MCP_ENDPOINT:/mcp}
    request-timeout: 10s
    call-timeout: 10s
    auth-token: ${MCP_AUTH_TOKEN:}
    user-email: ${WORKSPACE_USER_EMAIL:idankzm@gmail.com}
    tools:
      drive-create-file: ${MCP_TOOL_DRIVE_CREATE:create_drive_file}
      calendar-create-event: ${MCP_TOOL_CALENDAR_CREATE:manage_event}
      calendar-delete-event: ${MCP_TOOL_CALENDAR_DELETE:manage_event}
    drive:
      invoices-folder-id: ${DRIVE_INVOICES_FOLDER_ID:18Dinq5x46OWcqmTEljaXytGHd4jJ-aRw}
      invoice-source-url-template: ${INVOICE_SOURCE_URL_TEMPLATE:http://order-service:8081/api/v1/orders/%s/invoice}
    calendar:
      calendar-id: ${CALENDAR_ID:primary}
      time-zone: Asia/Jerusalem
      delivery-window: 2h

resilience4j:
  retry:
    instances:
      workspaceMcp:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        ignore-exceptions:
          - com.company.workspace.mcp.McpToolException
  circuitbreaker:
    instances:
      workspaceMcp:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 6s
        ignore-exceptions:
          - com.company.workspace.mcp.McpToolException
  bulkhead:
    instances:
      workspaceMcp:
        max-concurrent-calls: 15
        max-wait-duration: 300ms
  timelimiter:
    instances:
      workspaceMcp:
        timeout-duration: 10s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,bulkheads
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
