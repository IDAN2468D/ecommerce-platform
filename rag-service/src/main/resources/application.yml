server:
  port: 8092
  shutdown: graceful

spring:
  application:
    name: rag-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_db?maxPoolSize=50&minPoolSize=10&maxIdleTimeMS=300000&connectTimeoutMS=5000&socketTimeoutMS=30000&serverSelectionTimeoutMS=5000&waitQueueTimeoutMS=5000&uuidRepresentation=standard}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: rag-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.common.events,com.company.*,*"

clients:
  cart:
    base-url: ${CART_SERVICE_URL:http://localhost:8088}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  shipping:
    base-url: ${SHIPPING_SERVICE_URL:http://localhost:8086}

rag:
  cache:
    enabled: ${RAG_CACHE_ENABLED:true}
    similarity-threshold: ${RAG_CACHE_SIMILARITY_THRESHOLD:0.92}
  vector:
    collection-name: catalog_embeddings
    index-name: vector_index
    dimensions: 768
    num-candidates: 100
    top-k-default: 4
  llm:
    provider: google-gemini
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:demo_key}
    temperature: 0.2
    max-tokens: 1024
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

resilience4j:
  circuitbreaker:
    instances:
      geminiLlm:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5000ms
  retry:
    instances:
      geminiLlm:
        maxAttempts: 2
        waitDuration: 300ms
  bulkhead:
    instances:
      geminiLlm:
        maxConcurrentCalls: 20
        maxWaitDuration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,bulkheads
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:rag-service},%X{traceId:-},%X{spanId:-}]"
