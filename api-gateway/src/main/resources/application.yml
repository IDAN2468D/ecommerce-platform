server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  cloud:
    gateway:
      routes:
        # 1. Order Service Route
        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**

        # 2. Inventory & Products Service Route
        - id: inventory-service-route
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**

        - id: products-service-route
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**

        # 3. Payment Service Route
        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**

        # 4. Notification Service Route
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**

        # 5. Authentication & User Service Route
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/auth/**

        # 6. Shipping & Delivery Service Route
        - id: shipping-service-route
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/shipping/**

        # 7. Review & Rating Service Route
        - id: review-service-route
          uri: ${REVIEW_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/reviews/**

        # 8. Cart & Wishlist Service Route
        - id: cart-service-route
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/cart/**

        - id: wishlist-service-route
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/wishlist/**

        # 9. Recommendation & Loyalty Service Route
        - id: loyalty-service-route
          uri: ${LOYALTY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/loyalty/**

        - id: recommendations-service-route
          uri: ${LOYALTY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/recommendations/**

        # 10. Workspace Integration Service Route (Google Drive & Calendar via MCP)
        - id: workspace-service-route
          uri: ${WORKSPACE_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/workspace/**

        # 11. AI RAG Service Route (Single Source of Truth in rag-service)
        - id: rag-service-route
          uri: ${RAG_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/rag/**

        # 12. Python Multi-Agent Swarm Service Route
        - id: agent-swarm-service-route
          uri: ${AGENT_SWARM_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/agents/**

jwt:
  secret: ${JWT_SECRET:order-service-default-secret-key-32-bytes!!}

gateway:
  security:
    enforce-jwt: ${GATEWAY_ENFORCE_JWT:true}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    rag-requests-per-minute: ${GATEWAY_RAG_RPM:40}
    order-requests-per-minute: ${GATEWAY_ORDER_RPM:60}
    default-requests-per-minute: ${GATEWAY_DEFAULT_RPM:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:api-gateway},%X{traceId:-},%X{spanId:-}]"
