server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  cloud:
    gateway:
      routes:
        # 1. Order Service Route
        - id: order-service-route
          uri: ${ORDER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**

        # 2. Inventory & Products Service Route
        - id: inventory-service-route
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**

        - id: products-service-route
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**

        # 3. Payment Service Route
        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/payments/**

        # 4. Notification Service Route
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**

        # 5. Authentication & User Service Route
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/auth/**

        # 6. Shipping & Delivery Service Route
        - id: shipping-service-route
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/shipping/**

        # 7. Review & Rating Service Route
        - id: review-service-route
          uri: ${REVIEW_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/reviews/**

        # 8. Cart & Wishlist Service Route
        - id: cart-service-route
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/cart/**

        - id: wishlist-service-route
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/wishlist/**

        # 9. Recommendation & Loyalty Service Route
        - id: loyalty-service-route
          uri: ${LOYALTY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/loyalty/**

        - id: recommendations-service-route
          uri: ${LOYALTY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/recommendations/**

        # 10. Workspace Integration Service Route (Google Drive & Calendar via MCP)
        - id: workspace-service-route
          uri: ${WORKSPACE_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/workspace/**

        # 11. AI RAG Service Route (Single Source of Truth in rag-service)
        - id: rag-service-route
          uri: ${RAG_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/rag/**

        # 12. Python Multi-Agent Swarm Service Route
        - id: agent-swarm-service-route
          uri: ${AGENT_SWARM_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/agents/**

        # 13. RMA & Returns Service Route
        - id: rma-returns-service-route
          uri: ${RMA_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/v1/returns/**

        # 14. Dynamic Pricing & Auto-Buy Service Route
        - id: dynamic-pricing-service-route
          uri: ${PRICING_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/pricing/**

        # 15. Fraud & Risk Protection Service Route
        - id: fraud-risk-service-route
          uri: ${FRAUD_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/v1/fraud/**

        # 16. Merchant Analytics & Forecasting Service Route
        - id: merchant-analytics-service-route
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/analytics/**

        # 17. Subscription & Recurring Billing Service Route
        - id: subscription-billing-service-route
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8098}
          predicates:
            - Path=/api/v1/subscriptions/**

        # 18. Multi-Vendor Marketplace Route
        - id: marketplace-vendor-service-route
          uri: ${MARKETPLACE_SERVICE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/marketplace/**

        # 19. Flash Sale & Live Auction Service Route
        - id: flash-sale-auction-service-route
          uri: ${FLASH_SALE_SERVICE_URL:http://localhost:8100}
          predicates:
            - Path=/api/v1/flash-sales/**

        # 20. BNPL & Instant Split Credit Service Route
        - id: bnpl-credit-service-route
          uri: ${BNPL_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/bnpl/**

        # 21. Social Group Buy & Referral Service Route
        - id: group-buy-referral-service-route
          uri: ${GROUP_BUY_SERVICE_URL:http://localhost:8102}
          predicates:
            - Path=/api/v1/group-buy/**

        # 22. Digital Warranty & Smart Escrow Service Route
        - id: warranty-escrow-service-route
          uri: ${WARRANTY_ESCROW_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/v1/warranties/**

        # 23. AI Trade-In & Circular Commerce Service Route
        - id: trade-in-circular-service-route
          uri: ${TRADE_IN_SERVICE_URL:http://localhost:8104}
          predicates:
            - Path=/api/v1/trade-in/**

        # 24. Social Gifting & Multi-Payer Split Service Route
        - id: gift-registry-splitpay-service-route
          uri: ${GIFTING_SERVICE_URL:http://localhost:8105}
          predicates:
            - Path=/api/v1/gifting/**

        # 25. B2B Corporate Wholesale Quote Service Route
        - id: b2b-wholesale-quote-service-route
          uri: ${B2B_QUOTE_SERVICE_URL:http://localhost:8106}
          predicates:
            - Path=/api/v1/b2b-quotes/**

        # 26. Equipment Rental & Rent-to-Own Leasing Service Route
        - id: rental-leasing-service-route
          uri: ${RENTAL_LEASING_SERVICE_URL:http://localhost:8107}
          predicates:
            - Path=/api/v1/rentals/**

        # 27. Cross-Border Customs, VAT & DDP Tax Engine Route
        - id: customs-tax-duty-service-route
          uri: ${CUSTOMS_TAX_SERVICE_URL:http://localhost:8108}
          predicates:
            - Path=/api/v1/customs/**

        # 28. AI Custom Rig & Setup Configurator Service Route
        - id: custom-configurator-service-route
          uri: ${CUSTOM_CONFIGURATOR_SERVICE_URL:http://localhost:8109}
          predicates:
            - Path=/api/v1/configurator/**

        # 29. Omnichannel Smart Lockers & Multi-Warehouse OMS Route
        - id: omnifillment-locker-service-route
          uri: ${OMNIFILLMENT_LOCKER_SERVICE_URL:http://localhost:8110}
          predicates:
            - Path=/api/v1/fulfillment/**

        # 30. Home Installation & Certified Technician Setup Route
        - id: field-installation-service-route
          uri: ${FIELD_INSTALLATION_SERVICE_URL:http://localhost:8111}
          predicates:
            - Path=/api/v1/installations/**

        # 31. Green Logistics & Carbon Sustainability Service Route
        - id: carbon-sustainability-service-route
          uri: ${CARBON_SUSTAINABILITY_SERVICE_URL:http://localhost:8112}
          predicates:
            - Path=/api/v1/sustainability/**

        # 32. Smart Multi-Currency Wallet & Digital Gift Cards Route
        - id: digital-wallet-giftcard-service-route
          uri: ${DIGITAL_WALLET_SERVICE_URL:http://localhost:8113}
          predicates:
            - Path=/api/v1/wallet/**

        # 33. Live Shopping & Creator Affiliate Hub Route
        - id: creator-affiliate-live-service-route
          uri: ${CREATOR_AFFILIATE_SERVICE_URL:http://localhost:8114}
          predicates:
            - Path=/api/v1/creators/**

jwt:
  secret: ${JWT_SECRET:order-service-default-secret-key-32-bytes!!}

gateway:
  security:
    enforce-jwt: ${GATEWAY_ENFORCE_JWT:true}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    rag-requests-per-minute: ${GATEWAY_RAG_RPM:40}
    order-requests-per-minute: ${GATEWAY_ORDER_RPM:60}
    default-requests-per-minute: ${GATEWAY_DEFAULT_RPM:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:api-gateway},%X{traceId:-},%X{spanId:-}]"
